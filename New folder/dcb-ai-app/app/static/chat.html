<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DCB Assistant — CESC, Mysuru</title>
<link rel="icon" href="/static/cesc-mark.svg" type="image/svg+xml">
<link rel="preload" href="/static/vendor/fonts/NotoSans-400-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/vendor/fonts/NotoSerif-600-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/vendor/fonts.css?v=20261005j">
<style>
  /* AI mode: the RDPR / KPCL assistant's shell (portal header, navy app bar, sidebar of grouped questions, a
     conversation over a soft skyline) in the CESC website palette: navy #072577 / #151b54 / #121d81, amber #e38f00,
     orange #e54825, blue #2271a0, the Karnataka flag's yellow over red as a hairline under the header.
  */
  :root{
    --font-scale:1;
    --navy:#072577; --navy-deep:#151b54; --navy-mid:#121d81; --navy-soft:#eaeefa; --navy-glow:#1725a5;
    --steel:#4a5878; --sky:#2271a0; --orange:#e54825; --on-navy:#ffd84d;
    --gold:#e38f00; --gold-bright:#ffcd00; --gold-deep:#9a5b00; --gold-soft:#fff6e0; --gold-line:#f2d9a6;
    --kn-yellow:#ffcd00; --kn-red:#d82221;
    --paper:#f8f9fd; --surface:#ffffff; --bg:#f2f4fa;
    --ink:#1a2233; --muted:#5b667a; --faint:#8a94a6; --border:#e2e6f0; --border-strong:#d0d7e6;
    --err:#b81c1b; --err-soft:#fdeceb; --err-border:#f3c9c6;
    --note:#7a5200; --note-bg:#fff8e8; --note-border:#f0dca0;
    --ok:#1f9d57; --good:#1f9d57; --red:#d82221; --red-soft:#fdeceb;
    --serif:"Noto Serif","Noto Serif Kannada",Georgia,"Times New Roman",serif;
    --sans:"Noto Sans","Noto Sans Kannada","Segoe UI",system-ui,Arial,sans-serif;
  }
  body.hc{
    --navy:#000; --navy-deep:#000; --navy-mid:#000; --navy-soft:#fff; --navy-glow:#000; --steel:#000; --sky:#000; --orange:#000;
    --gold:#000; --gold-deep:#000; --gold-soft:#fff; --gold-line:#000; --paper:#fff; --bg:#fff;
    --ink:#000; --muted:#000; --faint:#000; --border:#000; --border-strong:#000; --err:#a4000c; --note:#000; --note-bg:#fff; --note-border:#000;
  }
  body.hc *{box-shadow:none!important;background-image:none!important;text-shadow:none!important}
  body.hc .bubble,body.hc .composer-box,body.hc .welcome-card,body.hc .side-item{border-width:2px!important}
  *{box-sizing:border-box}
  button,input{font-family:inherit}
  html{font-size:calc(16px * var(--font-scale))}
  html,body{height:100%}
  body{margin:0;font-family:var(--sans);font-size:1rem;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;
       height:100vh;height:100dvh;overflow:hidden;-webkit-font-smoothing:antialiased}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  [hidden]{display:none!important}

  /* ---------- opening splash (once per browser session) and the trip back to the dashboard ---------- */
  .splash,.go-overlay{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;
    background:radial-gradient(circle at 50% 40%,var(--navy-mid) 0%,var(--navy) 50%,var(--navy-deep) 100%);transition:opacity .5s ease,visibility .5s ease}
  .go-overlay{animation:fadeIn .25s ease both}
  .splash.gone{opacity:0;visibility:hidden;pointer-events:none}
  .splash-logos{display:flex;gap:28px}
  .splash-halo{position:relative;display:inline-flex;border-radius:50%}
  .splash-halo::before{content:"";position:absolute;inset:-6px;border-radius:50%;
    background:conic-gradient(from 0deg,rgba(255,255,255,.15),var(--on-navy),rgba(255,255,255,.15),#ff6a4d,rgba(255,255,255,.15));animation:spin 2.4s linear infinite}
  .splash-halo img{position:relative;z-index:1;width:66px;height:66px;object-fit:contain;border-radius:50%;background:#fff;padding:8px;animation:popIn .7s ease-out both}
  .splash-halo:nth-child(2) img{animation-delay:.12s}
  .splash-text{color:#fff;text-align:center;animation:fadeIn .6s ease-out .25s both}
  .splash-text b{display:block;font-family:var(--serif);font-weight:600;font-size:1.25rem;letter-spacing:.3px}
  .splash-text small{display:block;margin-top:8px;font-size:.7rem;letter-spacing:2.4px;text-transform:uppercase;color:var(--on-navy)}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes popIn{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}

  /* ---------- header ---------- */
  .gov-header{flex:0 0 auto;background:var(--surface);position:relative;z-index:5}
  .gov-topbar{display:flex;align-items:center;gap:16px;padding:10px 24px}
  .gov-brand{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
  .logo-halo{position:relative;display:inline-flex;border-radius:50%;flex:0 0 auto}
  .logo-halo::before{content:"";position:absolute;inset:-3px;border-radius:50%;opacity:0;background:conic-gradient(from 0deg,var(--navy),var(--gold-bright),var(--kn-red),var(--navy))}
  .logo-halo img{position:relative;z-index:1;height:46px;width:46px;object-fit:contain;border-radius:50%;background:#fff;border:1px solid var(--border);padding:3px}
  #govBrand.thinking .logo-halo::before{opacity:1;animation:spin 1.6s linear infinite}
  .brand-divider{width:1px;height:36px;background:var(--border);margin:0 4px}
  .gov-titles{line-height:1.2;min-width:0}
  .gov-line1{font-size:.66rem;color:var(--gold-deep);font-weight:600;letter-spacing:2px;text-transform:uppercase}
  .gov-line2{font-family:var(--serif);font-size:1.12rem;color:var(--navy);font-weight:600;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top-tools{display:flex;align-items:center;gap:8px;flex:0 0 auto}
  .lang-switch{display:inline-flex;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden;flex:0 0 auto}
  .lang-switch button{background:var(--surface);border:none;color:var(--muted);font-size:.78rem;font-weight:600;padding:6px 11px;cursor:pointer;transition:background .15s ease,color .15s ease}
  .lang-switch button + button{border-left:1px solid var(--border-strong)}
  .lang-switch button:hover{color:var(--navy);background:var(--navy-soft)}
  .lang-switch button[aria-pressed="true"]{background:var(--navy);color:#fff}

  .app-bar{display:flex;align-items:center;gap:12px;padding:9px 24px;color:#fff;background:linear-gradient(100deg,var(--navy-deep) 0%,var(--navy) 55%,var(--navy-mid) 100%)}
  .app-bar-text{font-size:.8rem;font-weight:500;letter-spacing:.2px;color:rgba(255,255,255,.9);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .app-bar-text b{font-weight:700;color:#fff}
  .app-bar-text .sep{color:var(--on-navy);margin:0 8px}
  .ai-badge{margin-left:auto;flex:0 0 auto;position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:6px;padding:4px 12px 4px 10px;border-radius:999px;
    font-size:.66rem;font-weight:700;letter-spacing:1.2px;color:#fff;background:linear-gradient(135deg,rgba(255,216,77,.28),rgba(255,216,77,.08));border:1px solid rgba(255,216,77,.7);
    animation:glow 3s ease-in-out infinite}
  .ai-badge::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(120deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:shimmer 4s ease-in-out infinite}
  .ai-badge svg{width:12px;height:12px;color:var(--on-navy)}
  @keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,216,77,0)}50%{box-shadow:0 0 14px 1px rgba(255,216,77,.45)}}
  @keyframes shimmer{0%,15%{left:-60%}35%,100%{left:130%}}
  .drawer-toggle{display:none;flex:0 0 auto;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:.74rem;font-weight:600;padding:5px 11px;border-radius:6px;cursor:pointer}
  .flag-rule{height:3px;background:linear-gradient(180deg,var(--kn-yellow) 0 50%,var(--kn-red) 50% 100%)}

  /* ---------- sidebar ---------- */
  .app-shell{flex:1;display:flex;min-height:0;overflow:hidden}
  .sidebar{flex:0 0 auto;width:290px;background:var(--paper);border-right:1px solid var(--border);overflow-y:auto;padding:20px 16px 24px;
    display:flex;flex-direction:column;gap:20px;scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent}
  #newchat{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--navy);border:1px solid var(--navy);color:#fff;
    font-size:.84rem;font-weight:600;letter-spacing:.2px;padding:10px 14px;border-radius:8px;cursor:pointer;transition:background .15s ease,box-shadow .15s ease}
  #newchat svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2}
  #newchat:hover{background:var(--navy-deep);box-shadow:0 4px 14px rgba(7,37,119,.22)}
  .dash-link{flex:0 0 auto;min-height:62px;position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;text-decoration:none;color:#fff;isolation:isolate;
    background:radial-gradient(circle at 100% 0%,rgba(255,205,0,.30),transparent 55%),linear-gradient(135deg,var(--navy-deep),var(--navy) 55%,var(--navy-mid));
    border:1px solid rgba(255,216,77,.45);box-shadow:0 6px 18px rgba(7,37,119,.22);transition:transform .2s ease,box-shadow .25s ease,border-color .2s ease}
  .dash-link::after{content:"";position:absolute;top:0;bottom:0;left:-70%;width:45%;z-index:-1;background:linear-gradient(115deg,transparent,rgba(255,255,255,.22),transparent);transform:skewX(-18deg);transition:left .7s ease}
  .dash-link:hover{transform:translateY(-2px);border-color:var(--on-navy);box-shadow:0 12px 28px rgba(7,37,119,.32),0 0 0 3px rgba(255,216,77,.18)}
  .dash-link:hover::after{left:130%}
  .dash-link:focus-visible{outline:2px solid var(--on-navy);outline-offset:3px}
  .dash-ico{flex:0 0 auto;width:38px;height:38px;border-radius:10px;display:flex;align-items:flex-end;justify-content:center;gap:3px;padding:0 0 9px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18)}
  .dash-ico i{display:block;width:4px;border-radius:2px;background:linear-gradient(180deg,#ffe58a,var(--gold-bright));transition:height .35s cubic-bezier(.2,.8,.2,1)}
  .dash-ico i:nth-child(1){height:9px}.dash-ico i:nth-child(2){height:15px}.dash-ico i:nth-child(3){height:11px}.dash-ico i:nth-child(4){height:19px}
  .dash-link:hover .dash-ico i:nth-child(1){height:14px}.dash-link:hover .dash-ico i:nth-child(2){height:10px}.dash-link:hover .dash-ico i:nth-child(3){height:19px}.dash-link:hover .dash-ico i:nth-child(4){height:13px}
  .dash-txt{display:flex;flex-direction:column;line-height:1.15;min-width:0}
  .dash-txt b{font-family:var(--serif);font-size:1.02rem;font-weight:600;letter-spacing:.2px}
  .dash-txt small{font-size:.66rem;color:rgba(255,255,255,.72);letter-spacing:.4px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dash-go{margin-left:auto;flex:0 0 auto;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#ffe58a,var(--gold-bright));color:var(--navy-deep);transition:transform .25s ease}
  .dash-go svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .dash-link:hover .dash-go{transform:translateX(3px)}
  .side-group h3{margin:0 0 8px;display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:.8rem;font-weight:600;color:var(--navy);letter-spacing:.3px}
  .side-group h3::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold-line),transparent)}
  .side-list{display:flex;flex-direction:column}
  .side-item{position:relative;display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:none;border:none;border-radius:7px;padding:8px 10px 8px 12px;color:var(--ink);font-size:.8rem;line-height:1.4;cursor:pointer;transition:background .15s ease,color .15s ease}
  .side-item::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:2px;border-radius:2px;background:var(--gold);transform:scaleY(0);transition:transform .18s ease}
  .side-item:hover{background:var(--surface);color:var(--navy);box-shadow:0 1px 4px rgba(7,37,119,.06)}
  .side-item:hover::before{transform:scaleY(1)}
  .side-item svg{flex:0 0 auto;width:15px;height:15px;margin-top:2px;stroke:var(--steel);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

  .center-col{flex:1;display:flex;flex-direction:column;min-width:0}
  .drawer-backdrop{display:none}
  @media(max-width:1024px){
    .drawer-toggle{display:inline-flex;align-items:center}
    .sidebar{position:fixed;top:0;bottom:0;left:0;width:300px;max-width:88vw;z-index:40;transform:translateX(-100%);transition:transform .22s ease;box-shadow:0 0 30px rgba(21,27,84,.25)}
    body.sidebar-open .sidebar{transform:translateX(0)}
    body.sidebar-open .drawer-backdrop{display:block;position:fixed;inset:0;background:rgba(21,27,84,.4);z-index:30}
  }

  /* ---------- conversation (fixed backdrop; .chat-scroll is what scrolls) ---------- */
  .chat-viewport{position:relative;flex:1;min-height:0;isolation:isolate}
  .chat-viewport::before{content:"";position:absolute;inset:0;z-index:-2;pointer-events:none;
    background:radial-gradient(ellipse at 85% 0%,rgba(227,143,0,.07),transparent 50%),radial-gradient(ellipse at 0% 0%,rgba(34,113,160,.12),transparent 55%),
      linear-gradient(180deg,#f1f4fb 0%,#f5f6fa 50%,#f9f7f1 100%)}
  .chat-viewport::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.32;mix-blend-mode:multiply;
    background:url('/static/chat_bg_skyline.png') no-repeat bottom center/100% auto}
  body.hc .chat-viewport::before,body.hc .chat-viewport::after{display:none}
  .chat-scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent}
  main{min-height:100%;padding:26px 24px 44px;display:flex;flex-direction:column;gap:18px;max-width:900px;width:100%;margin:0 auto}

  .welcome{margin:auto 0;padding:10px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;animation:rise .5s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .eyebrow{font-size:.68rem;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--gold-deep)}
  .welcome h2{margin:10px 0 0;font-family:var(--serif);font-size:2rem;font-weight:600;color:var(--navy);line-height:1.2;letter-spacing:-.2px}
  .ornament{display:flex;align-items:center;gap:10px;margin:14px 0 26px}
  .ornament i{display:block;width:56px;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
  .ornament i:last-child{background:linear-gradient(90deg,var(--gold),transparent)}
  .ornament b{width:7px;height:7px;background:var(--gold);transform:rotate(45deg)}
  .welcome p{margin:0 0 22px;font-size:.9rem;color:var(--muted);max-width:620px;line-height:1.65}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:740px;margin-bottom:24px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 2px 10px rgba(7,37,119,.04)}
  .stat{padding:14px 10px}
  .stat + .stat{border-left:1px solid var(--border)}
  .stat b{display:block;font-family:var(--serif);font-size:1.3rem;font-weight:600;color:var(--navy);font-variant-numeric:lining-nums tabular-nums}
  .stat span{display:block;font-size:.68rem;color:var(--muted);line-height:1.35;margin-top:3px}
  .cards-label{align-self:stretch;max-width:800px;margin:0 auto 10px;width:100%;text-align:left;font-size:.68rem;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--faint)}
  .welcome-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:800px}
  .welcome-card{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 14px 13px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;cursor:pointer;text-align:left;color:var(--ink);
    transition:border-color .18s ease,box-shadow .2s ease,transform .2s ease;animation:rise .45s ease both}
  .welcome-card:nth-child(2){animation-delay:.04s}.welcome-card:nth-child(3){animation-delay:.08s}.welcome-card:nth-child(4){animation-delay:.12s}.welcome-card:nth-child(5){animation-delay:.16s}.welcome-card:nth-child(6){animation-delay:.2s}
  .welcome-card::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .25s ease}
  .welcome-card:hover{border-color:var(--border-strong);box-shadow:0 10px 26px rgba(7,37,119,.10);transform:translateY(-2px)}
  .welcome-card:hover::before{transform:scaleX(1)}
  .welcome-card .top{display:flex;align-items:center;gap:9px;width:100%}
  .welcome-card svg{flex:0 0 auto;width:17px;height:17px;stroke:var(--steel);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .welcome-card .title{font-size:.84rem;font-weight:600;color:var(--navy)}
  .welcome-card .q{font-size:.76rem;color:var(--muted);line-height:1.45}
  @media(max-width:880px){ .welcome-cards{grid-template-columns:1fr 1fr} }
  @media(max-width:560px){ .welcome-cards{grid-template-columns:1fr} .stats{grid-template-columns:1fr 1fr}
    .stat:nth-child(3){border-left:none} .stat:nth-child(n+3){border-top:1px solid var(--border)} .welcome h2{font-size:1.5rem} }

  .msg{display:flex;gap:12px;max-width:92%;animation:msgIn .25s ease both}
  @keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .av{width:32px;height:32px;border-radius:50%;flex:0 0 32px;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .bot .av{background:#fff;border:1px solid var(--border);box-shadow:0 1px 3px rgba(7,37,119,.1)}
  .bot .av img{width:26px;height:26px;object-fit:contain}
  .user .av{background:var(--navy-soft);border:1px solid var(--border);color:var(--navy)}
  .user .av svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
  .msg > .bubble{min-width:0;max-width:100%}
  .bubble{padding:14px 18px;border-radius:12px;line-height:1.65;font-size:.94rem;overflow-wrap:anywhere}
  .bot{align-self:flex-start;width:92%}
  .bot .bubble{flex:1;background:rgba(255,255,255,.97);border:1px solid var(--border);border-top-left-radius:3px;box-shadow:0 4px 18px rgba(7,37,119,.06);transition:box-shadow .3s ease,border-color .3s ease}
  .bot.settled .bubble:hover{box-shadow:0 8px 26px rgba(7,37,119,.09);border-color:var(--border-strong)}
  .user{align-self:flex-end;flex-direction:row-reverse}
  .user .bubble{background:linear-gradient(135deg,var(--navy-mid),var(--navy));color:#fff;border-top-right-radius:3px;white-space:pre-wrap;box-shadow:0 4px 14px rgba(7,37,119,.22)}
  body.hc .user .bubble{background:#000}
  .bubble.err{background:var(--err-soft);border-color:var(--err-border);color:var(--err)}
  .bubble.refused{background:rgba(255,248,232,.97);border-color:var(--note-border)}
  .answer p{margin:0 0 9px}.answer p:last-child{margin:0}
  .answer ul{margin:4px 0 10px;padding:0;list-style:none}
  .answer li{position:relative;padding:3px 0 3px 18px}
  .answer li::before{content:"";position:absolute;left:3px;top:.85em;width:6px;height:6px;background:var(--gold);transform:rotate(45deg)}
  .answer strong{color:var(--navy);font-weight:700}
  .answer p.note{font-size:.84rem;color:var(--muted);background:var(--paper);border:1px solid var(--border);border-left:3px solid var(--gold);
    border-radius:8px;padding:8px 11px;line-height:1.55}
  .answer .note-tag{display:inline-block;margin-right:7px;font-size:.6rem;font-weight:800;letter-spacing:.7px;text-transform:uppercase;
    color:var(--gold-deep);background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:999px;padding:1px 7px;vertical-align:1px}
  .asked-as{font-size:.78rem;color:var(--muted);margin:0 0 9px;padding:2px 0 2px 10px;border-left:3px solid var(--gold);animation:fadeIn .25s ease both}
  .asked-as b{color:var(--navy);font-weight:600}
  .answer > p:first-child strong:first-child{font-family:var(--serif);font-weight:600;font-size:1.02rem}
  .answer .md-table{overflow-x:auto;margin:6px 0 10px;border:1px solid var(--border);border-radius:9px}
  .answer table{border-collapse:collapse;min-width:100%;font-size:.8rem}
  .answer th{background:#f4f6fc;color:var(--navy);font-weight:600;text-align:left;padding:7px 10px;border-bottom:1px solid var(--border-strong);white-space:nowrap}
  .answer td{padding:6px 10px;border-bottom:1px solid var(--border);vertical-align:top}
  .answer.streaming > :last-child::after,.answer.streaming > ul:last-child > li:last-child::after{content:"";display:inline-block;width:2px;height:1.05em;margin-left:2px;vertical-align:-3px;background:var(--gold);animation:blink 1s steps(1) infinite}
  .answer.streaming > ul:last-child::after,.answer.streaming > .md-table:last-child::after{content:none}
  @keyframes blink{50%{opacity:0}}

  /* live pipeline stages, streamed from the server */
  .progress{display:flex;flex-direction:column;gap:8px}
  .progress-bar{height:2px;border-radius:2px;background:var(--navy-soft);overflow:hidden;position:relative}
  .progress-bar::after{content:"";position:absolute;top:0;bottom:0;left:-35%;width:35%;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:sweep 1.3s ease-in-out infinite}
  @keyframes sweep{to{left:100%}}
  .stages{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78rem;color:var(--faint)}
  .stage{display:inline-flex;align-items:center;gap:6px;animation:fadeIn .25s ease both}
  .stage i{width:7px;height:7px;border-radius:50%;background:var(--border-strong)}
  .stage.done{color:var(--muted)}
  .stage.done i{background:var(--navy)}
  .stage.now{color:var(--navy);font-weight:600}
  .stage.now i{background:var(--gold);box-shadow:0 0 0 0 rgba(227,143,0,.6);animation:ping 1.2s ease-out infinite}
  @keyframes ping{to{box-shadow:0 0 0 7px rgba(227,143,0,0)}}
  .progress-row{display:flex;align-items:center;gap:12px}
  .progress-row .stages{flex:1}
  .elapsed{font-size:.72rem;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}

  .meta{margin-top:12px;padding-top:10px;border-top:1px solid var(--border);font-size:.72rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .pill{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:2px 8px;font-weight:600}
  .pill.nf,.pill.trunc{color:var(--note);border-color:var(--note-border);background:var(--note-bg)}
  .pill-btn{cursor:pointer;font:inherit;font-weight:600;line-height:inherit;display:inline-flex;align-items:center;gap:5px;color:var(--steel);transition:background .15s ease,border-color .15s ease,transform .15s ease,box-shadow .15s ease}
  .pill-btn:hover{background:var(--navy-soft);border-color:var(--border-strong);color:var(--navy);transform:translateY(-1px)}
  .pill-btn:active{transform:scale(.96)}
  .pill-btn svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2}
  .meta .spacer{flex:1}
  .pill-btn.report-btn{color:var(--gold-deep);border-color:var(--gold-line);background:linear-gradient(180deg,#fffdf6,var(--gold-soft));padding:3px 10px;box-shadow:0 1px 4px rgba(227,143,0,.14)}
  .pill-btn.report-btn:hover{color:var(--gold-deep);border-color:var(--gold);background:linear-gradient(180deg,#fff,#fdebc0);box-shadow:0 3px 10px rgba(227,143,0,.24)}
  .pill-btn.report-btn svg{width:13px;height:13px}
  .pill-btn.report-btn .xl{font-size:.56rem;font-weight:800;letter-spacing:.6px;padding:1px 5px;border-radius:999px;color:#fff;background:linear-gradient(135deg,var(--gold),var(--gold-deep))}
  .pill-btn.report-btn.busy{cursor:progress;opacity:.75}
  .pill-btn.report-btn.busy svg{animation:spin .8s linear infinite}
  .pill-btn.view-btn{color:var(--navy);border-color:var(--border-strong);padding:3px 10px}
  .pill-btn.view-btn svg{width:13px;height:13px}
  .pill-btn.report-btn.fail{color:var(--note);border-color:var(--note-border);background:var(--note-bg)}

  .reveal{animation:rise .45s ease both}
  .panel{margin-top:12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);overflow:hidden;max-width:100%;min-width:0}
  .panel > summary{cursor:pointer;padding:9px 12px;font-size:.78rem;font-weight:600;color:var(--navy);list-style:none;display:flex;align-items:center;gap:8px}
  .panel > summary::-webkit-details-marker{display:none}
  .panel > summary::before{content:"";width:6px;height:6px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:rotate(-45deg);transition:transform .15s ease;margin-right:2px}
  .panel[open] > summary::before{transform:rotate(45deg)}
  .panel .csv{margin-left:auto;font-size:.7rem;white-space:nowrap}
  .table-wrap{max-height:340px;overflow:auto;border-top:1px solid var(--border);scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent}
  .panel table{border-collapse:collapse;min-width:100%;font-size:.8rem;white-space:nowrap}
  .panel th{position:sticky;top:0;background:#f4f6fc;color:var(--navy);font-weight:600;text-align:left;padding:8px 12px;border-bottom:1px solid var(--border-strong)}
  .panel td{padding:7px 12px;border-bottom:1px solid var(--border)}
  .panel tbody tr:hover td{background:var(--gold-soft)}
  .panel .num{text-align:right;font-variant-numeric:tabular-nums}
  .panel .note{padding:7px 12px;font-size:.72rem;color:var(--muted)}
  .panel pre{margin:0 12px 10px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:#f4f6fc;font-family:"JetBrains Mono",ui-monospace,Consolas,monospace;font-size:.74rem;color:var(--navy-deep);white-space:pre-wrap;word-break:break-word}
  .panel .timing{margin:8px 12px 6px;font-family:ui-monospace,Consolas,monospace;font-size:.72rem;color:var(--muted)}
  .panel[open] > .table-wrap{animation:fadeIn .3s ease both}
  .bot .bubble > .ux-card{margin-top:14px}
  .bot .bubble > .ux-card.reveal,.bot .bubble > .ux-card{animation-delay:.06s}
  .bot .bubble > details.reveal{animation-delay:.14s}
  .bot .bubble > .meta.reveal{animation-delay:.2s}

  /* ---------- composer ---------- */
  footer{border-top:1px solid var(--border);background:var(--surface);padding:12px 18px 8px;flex:0 0 auto}
  .composer{max-width:900px;margin:0 auto}
  .composer-box{display:flex;align-items:center;gap:10px;border:1px solid var(--border-strong);border-radius:12px;padding:6px 6px 6px 16px;background:var(--surface);box-shadow:0 2px 10px rgba(7,37,119,.05);transition:border-color .2s ease,box-shadow .25s ease}
  .composer-box:focus-within{border-color:var(--navy);box-shadow:0 0 0 3px rgba(7,37,119,.10),0 8px 24px rgba(7,37,119,.08)}
  .composer-icon{flex:0 0 auto;width:17px;height:17px;color:var(--gold)}
  #box{flex:1;min-width:0;border:none;padding:9px 0;font-size:.95rem;outline:none;background:none;color:var(--ink)}
  #box::placeholder{color:var(--faint)}
  #send{display:inline-flex;align-items:center;gap:7px;border:none;border-radius:9px;padding:0 18px;height:40px;color:#fff;font-weight:600;font-size:.88rem;cursor:pointer;
    background:linear-gradient(135deg,var(--navy-glow),var(--navy) 60%,var(--navy-deep));transition:box-shadow .15s ease,transform .12s ease,filter .15s ease}
  #send svg{width:15px;height:15px;transition:transform .2s ease}
  #send:hover{filter:brightness(1.12);box-shadow:0 4px 14px rgba(7,37,119,.25)}
  #send:hover:not(:disabled) svg{transform:translateX(2px)}
  #send:active:not(:disabled){transform:scale(.96)}
  #send:disabled{opacity:.45;cursor:default;box-shadow:none}
  .footnote{max-width:900px;margin:7px auto 0;display:flex;align-items:center;gap:12px;font-size:.67rem;color:var(--faint)}
  .footnote .txt{flex:1;text-align:center}
  .model-status{display:inline-flex;align-items:center;gap:5px;color:var(--faint);white-space:nowrap}
  .model-status i{width:6px;height:6px;border-radius:50%;background:#c2c8d4}
  .model-status.ok i{background:var(--ok)}.model-status.off i{background:var(--gold)}.model-status.bad i{background:var(--err)}

  @media(max-width:768px){
    .gov-topbar{padding:8px 14px;gap:10px} .app-bar{padding:8px 14px} main{padding:16px 12px 28px}
    .msg,.bot{max-width:100%;width:100%} footer{padding:10px 10px 6px} .brand-divider{display:none}
  }
  @media(max-width:560px){
    .app-bar-text .extra{display:none} .logo-halo img{height:38px;width:38px} .logo-halo + .logo-halo{display:none}
    .gov-line2{font-size:.9rem;white-space:normal} .gov-line1{letter-spacing:1.2px}
    #send span{display:none} #send{padding:0;width:40px;justify-content:center}
    .footnote .txt{display:none} .footnote{justify-content:flex-end}
    .bubble{padding:12px 13px}
  }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
    .ai-badge::after,.progress-bar::after{display:none}
  }
</style>
